# Runs PostgreSQL only. Ollama, the API and the UI run on your machine (see README).
services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
